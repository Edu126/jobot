  <div class="gen-orb" aria-hidden="true"><span></span><span></span><span></span></div>
  <div>
    <div class="text-lg font-semibold">{{ _('prep2.build.title') }}</div>
    <p class="text-body-muted text-sm mt-1">{{ _('prep2.build.body') }}</p>
