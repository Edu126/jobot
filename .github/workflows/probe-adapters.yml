name: Adapter canaries

# Weekly probe: check per-ATS adapters (Greenhouse, Lever, Oracle HCM)
# still extract usable data from their public endpoints. ATSs change
# response shapes and endpoint paths without notice; this fires before
# a user does.
#
# Runs Monday mornings (UTC) + on demand via the Actions tab.
# Also runs on PRs that touch adapter code so a regression trips CI
# before merge.

on:
  schedule:
    # 07:00 UTC every Monday. Early enough that anyone starting a work
    # day sees the failure notification.
    - cron: '0 7 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'core/jobs/ats/**'
      - 'core/jobs/from_url.py'
      - 'core/net/**'
      - 'scripts/probe_adapters.py'
      - '.github/workflows/probe-adapters.yml'

concurrency:
  group: probe-adapters-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Probe ATS adapters
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run probes
        run: python scripts/probe_adapters.py
